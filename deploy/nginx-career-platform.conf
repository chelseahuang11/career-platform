# HTTPS from Cloudflare's proxy (port 443 is open only to Cloudflare's IP ranges).
# No port 80 block: Cloudflare redirects HTTP to HTTPS at its edge.
server {
    listen 443 ssl;
    server_name chelseahuang.me www.chelseahuang.me aws.chelseahuang.me;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
